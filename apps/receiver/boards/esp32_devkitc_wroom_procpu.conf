# ESP32 bench hardware has a storage partition used for the accepted sequence
# counter. The shared authentication key still comes from a local unversioned
# EXTRA_CONF_FILE.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_GATE_COUNTER_STORE_NVS=y
